# Mandarin two-speaker model on ArchiVoice's ACV data — the V2 recipe (GAN-free teacher, then a 1-step student),
# like configs/3singer_v2.yaml. Speakers: ACV-001 (0, male voice) / ACV-002 (1, the same singer's female voice).
# Phoneme list dict/zh_acv.phonemes (language pack dict/zh_acv.yaml): ACV's notation, where the medial is part of the
# main vowel and the coda is its own phoneme (xiao = x iA U, juan = j yE N). Only the Mandarin (cn) songs are used;
# the English words inside them are left out with the phrases around them (the recipes' drop_phones).
# ACV-001 and ACV-002 are CC BY-SA 4.0 (a model mainly featuring their voice follows that licence).
#
# 1. Put the full-length data under download/ (or point the recipes' db_root elsewhere):
#      download/ACV-001/full_length/cn/{labs,wavs}   download/ACV-002/full_length_samples/{labs,wavs}
# 2. Preprocess (locally; RMVPE on CPU, one recipe at a time):
#      python -m preprocess.run --recipe configs/recipes/acv001_cn.yaml --check     # labels only
#      python -m preprocess.run --recipe configs/recipes/acv001_cn.yaml             # -> data/acv001_cn
#      python -m preprocess.run --recipe configs/recipes/acv002_cn.yaml             # -> data/acv002_cn
# 3. Teacher (50k steps), then the 1-step student (20k steps from the teacher's weights):
#      python -m train --config configs/zh_acv.yaml --data_dirs data/acv001_cn data/acv002_cn \
#          --run_name zh_acv_teacher --out_root log --device cuda
#      python -m train --config configs/zh_acv.yaml --data_dirs data/acv001_cn data/acv002_cn \
#          --run_name zh_acv_student --out_root log --device cuda --max_updates 20000 \
#          --set train.reflow_teacher=log/zh_acv_teacher/ckpt_050000.pt --set train.reflow_teacher_steps=16 \
#          --set train.num_steps=1 --set train.lr=2.0e-4
mel:
  sr: 44100
  hop: 256
  n_fft: 2048
  win: 2048
  n_mels: 128
  fmin: 40.0
  fmax: 16000.0
model:
  hidden: 256
  backbone_ch: 256
  n_cycles: 3
  dilation_schedule: pow2_15
  encoder_type: attn
  spk_dim: 32
  n_speakers: 2
  n_styles: 0
  use_uv: false
  flow_loss: l2
  mel_vmin: -11.5
  mel_vmax: 2.0
  pos_cond:
    phoneme: true
    encoding: sinusoidal
    unit: false
    bins: 8
                          # nucleus: not set -> the language pack's vowels (the main vowels and M)
  dur_cond: false
excitation:
  n_harm: 256
  noise_ratio: 0.05
  exc_scale: 0.15
  harm_decay: 1.5
  x0_sigma: 0.0
train:
  lr: 8.0e-4              # the student overrides this with --set train.lr=2.0e-4
  grad_clip: 1.0
  optimizer: radam
  lr_decay: 0.8
  lr_decay_steps: 5000
  amp: bf16
  amp_fp32_io: true
  max_updates: 50000      # teacher. The student runs with --max_updates 20000
  max_batch_frames: 120000
  max_batch_size: 64
  min_batch_items: 16
  recon_weight: 0.5
  flow_loss: l2
  cons_weight: 1.0        # consonant loss weight. 1.0 = off
  cons_weight_next_ms: 30
  num_steps: 16           # the teacher solves the flow in 16 Euler steps. The student overrides this with 1
  reflow_draws: 4
  reflow_algorithm: euler
  reflow_t: zero
  reflow_seed: 0
  save_interval: 1000
  log_interval: 50
  eval_interval: 2000
  eval_items: 3
  eval_gen_metrics: true
  vocoder: checkpoints/nhv_v3_2_1.onnx   # not yet checked on this data: listen to the vocoded GT in TensorBoard first
  num_workers: 4
  pitch_aug: false
  balance_speakers: true  # ACV-002 has about a third of ACV-001's data; sample both voices equally
gan:
  enabled: false
data:
  spk_map:
    acv001_cn: 0
    acv002_cn: 1
  eval_songs: 2           # songs held out per speaker for evaluation
  min_sec: 0.3
  max_sec: 30
  silence: true
  silence_fade_sec: 0.05
  loudness_agc:
    sigma_sec: 1.0
    target_db: -30.0
    k: 1.0
    max_gain_db: 12.0
    max_cut_db: 12.0
