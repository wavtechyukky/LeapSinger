# Korean singing model, Mechol + SODAsoo — the same as configs/ko_mechol.yaml, plus SODAsoo (an adult woman, 6 labelled
# songs, 10.1 min) as a second voice. The point is Mechol's voice: the woman's higher range should keep Mechol's model
# from breaking up where his data is thin. Only Mechol (id 0) is meant to be shown in the SVS.
# Phoneme list dict/ko_coda.phonemes; Mechol = speaker 0 as in PrettyPitch's Korean models.
# Research only: Sds-Korean-Singing-Dataset terms (ask before distributing a model with the data's characteristics;
# no commercial use); part of Mechol's data was given to us privately.
#
#      python -m train --config configs/ko_mechol_sodasoo.yaml --data_dirs <data>/mechol52 <data>/sds_sodasoo001 \
#          --run_name ko_mechol_sodasoo_teacher --out_root <log> --device cuda
#    then the student as in configs/ko_mechol.yaml. Compare the two teachers on Mechol's held-out pieces (the same
#    two pieces in both runs) and by ear on high notes.
mel:
  sr: 44100
  hop: 256
  n_fft: 2048
  win: 2048
  n_mels: 128
  fmin: 40.0
  fmax: 16000.0
model:
  hidden: 256
  backbone_ch: 256
  n_cycles: 3
  dilation_schedule: pow2_15
  encoder_type: attn
  spk_dim: 32
  n_speakers: 2
  n_styles: 0
  use_uv: false
  flow_loss: l2
  mel_vmin: -11.5
  mel_vmax: 2.0
  pos_cond:
    phoneme: true
    encoding: sinusoidal
    unit: false
    bins: 8
                          # nucleus: not set -> the language pack's vowels
  dur_cond: false
excitation:
  n_harm: 256
  noise_ratio: 0.05
  exc_scale: 0.15
  harm_decay: 1.5
  x0_sigma: 0.0
train:
  lr: 8.0e-4
  grad_clip: 1.0
  optimizer: radam
  lr_decay: 0.8
  lr_decay_steps: 5000
  amp: bf16
  amp_fp32_io: true
  max_updates: 50000      # the length of the adopted Japanese teacher; checkpoints every 1000 to pick from
  max_batch_frames: 120000
  max_batch_size: 64
  min_batch_items: 16
  recon_weight: 0.5
  flow_loss: l2
  cons_weight: 1.0
  cons_weight_next_ms: 30
  num_steps: 16
  save_interval: 1000
  log_interval: 50
  eval_interval: 2000
  eval_items: 3
  eval_gen_metrics: true
  vocoder: checkpoints/nhv_v3_2_1.onnx   # trained on Japanese voices: listen to the vocoded GT (spk*/s*_gt) first
  num_workers: 4
  pitch_aug: false
  balance_speakers: false # in proportion to the data (Mechol ~52 min : SODAsoo ~10 min) — Mechol is the target
gan:
  enabled: false
data:
  spk_map:
    mechol52: 0           # man — the voice for the SVS
    sds_sodasoo001: 1     # woman — support data, not shown
  # Only Mechol is held out (the same two pieces as configs/ko_mechol.yaml); all of SODAsoo is used for training.
  eval_dbs: [mechol52]
  eval_songs: 2
  min_sec: 0.3
  max_sec: 30
  silence: true
  silence_fade_sec: 0.05
  loudness_agc:
    sigma_sec: 1.0
    target_db: -30.0
    k: 1.0
    max_gain_db: 12.0
    max_cut_db: 12.0
