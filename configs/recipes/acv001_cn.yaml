# Recipe: ACV-001 の中国語（普通話）の曲。男声 1 人（ArchiVoice、Jonathan Huang さん）、54 曲・約 2.4 時間（無音込み）。
# https://github.com/Archivoice/ACV-001 （CC BY-SA 4.0）。表記は ACV の中国語（dict/zh_acv.phonemes）。
# full_length 版の cn/ をそのまま使う（labs/<曲>.lab と wavs/<曲>.wav、HTK 100 ns）。
# 中国語の曲の中の英単語（en/…）は drop_phones で、まわりのフレーズごと除く。
# 息の仲間（mlem = 息の頭の舌打ち、exh・axh = 吐く息、hx = 息の抜け）は pau にまとめる。
# vf（ボーカルフライ）と M（ハミング）は音素として残す。
name: acv001_cn
name_prefix: acv001_
phonemes: dict/zh_acv.phonemes
spk_id: 0                 # train.py の既定（config の data.spk_map が優先）
style_id: 0
lab_unit: "100ns"
save_wav: false

layout: from_lab
db_root: "download/ACV-001/full_length/cn"
wav: "wavs/{song}.wav"
lab: "labs/{song}.lab"

drop_phones: ["en/"]
phon_norm:
  "SP": pau
  "AP": pau
  "mlem": pau
  "exh": pau
  "axh": pau
  "hx": pau
  "vf": vf                # 既定の無音の写像（vf → pau）より優先する
exclude: []
