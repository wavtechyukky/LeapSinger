# Recipe: Alex Floarea AI-SVS（旧版、イギリス英語、224 本、1.84 h）。研究・多話者の学習は可、モデルの配布は作者の許可が要る。
# ラベルは HTK（100 ns）。oh = イギリス英語の LOT 母音（辞書にある）、exh = 句末の吐息、M・N = M.wav・N.wav のハミング、
# i は iy の書き間違い。練習の素材（M、N、oh-*、zh-*、bop、ConsonantClusters* など）も含む。
name: alex_ai_svs
phonemes: dict/en_full.phonemes
spk_id: 23                 # train.py の既定（config の data.spk_map が優先）
style_id: 0
lab_unit: "100ns"
save_wav: false

layout: type_split
db_root: "download/alex_ai_svs"        # 配布元のフォルダをそのまま置く。絶対パスでもよい
wav_dir: "wav"
wav: "wav/{song}.wav"
lab: "lab/{song}.lab"

phon_norm:
  "SP": pau
  "AP": pau
  "exh": pau
  "vf": vf
  "M": m
  "N": n
  "i": iy
exclude: []
