# Recipe: Sds-Korean-Singing-Dataset の Mechol-001（十代の男性 1 人、31.5 分の wav 1 本）。表記は Team CODA。
# 公開元の規約（2026-10-18 改定）: データの特徴を出すモデルの配布は事前に問い合わせ、商用は不可。
# 1 本のままだと、RMVPE が 31 分を一度に処理して RMVPE のメモリが足りなくなり、曲単位で評価用に抜くこともできない。
# そこで tools/convert_labels.py lab --split_sec 60 で、0.3 秒以上の休みの真ん中で約 1 分ずつの 29 片
# （mechol_natural_s000 … s028）に切った。元のデータ: Sds-Korean-Singing-Dataset の Mechol-001
# exh = 句末の吐息、trash = 雑音の印（どちらも pau へ）。vf は音素のまま。
name: sds_mechol001
phonemes: dict/ko_coda.phonemes
spk_id: 0                 # train.py の既定（config の data.spk_map が優先）
style_id: 0
lab_unit: "100ns"
save_wav: false

layout: from_lab
db_root: "download/sds_mechol001"        # tools/convert_labels.py で整えたラベルと wav。絶対パスでもよい
wav: "{song}.wav"
lab: "{song}.lab"

phon_norm:
  "SP": pau
  "AP": pau
  "exh": pau
  "trash": pau
  "vf": vf
exclude: []
