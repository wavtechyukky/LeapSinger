# Recipe: NGYY（南宫颜·羽）の英語、声色 Lan。他人やほかのキャラクターの名前で公開しないこと。
# ラベルは DiffSinger の transcriptions.csv だけなので、tools/convert_labels.py csv で lab に変換したものを読む:
#   python tools/convert_labels.py csv --src download/ngyy_lan/transcriptions.csv \
#       --out download/ngyy_lan_labels
name: ngyy_lan
phonemes: dict/en_full.phonemes
spk_id: 26                 # train.py の既定（config の data.spk_map が優先）
style_id: 0
lab_unit: "100ns"
save_wav: false

layout: type_split
db_root: "download/ngyy_lan"        # 配布元のフォルダをそのまま置く。絶対パスでもよい
wav_dir: "wavs"
wav: "wavs/{song}.wav"
lab: "download/ngyy_lan_labels/{song}.lab"

phon_norm:
  "SP": pau
  "AP": pau
exclude: []
