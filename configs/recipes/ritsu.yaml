# Recipe: 波音リツ (Namine Ritsu) singing DB, Ver 2.0-2.2.
# Per-song folders each holding {song}.{lab,musicxml,wav}. lab is HTS 100ns.
name: ritsu
spk_id: 1
style_id: 0                # tone id (kire/無印=0 / normal=1 / soft=2) — kept in the shard for style-aware training.
lab_unit: "100ns"
save_wav: false            # set true to enable pitch augmentation (stores clip wav)

layout: per_song
db_root: download/ritsu/DATABASE
wav: "{song}/{song}.wav"
lab: "{song}/{song}.lab"

# ritsu labels glottal stops; fold them into the geminate-closure symbol.
phon_norm:
  GlottalStop: cl

# songs to skip (bad score/F0). Fill in as needed.
# Excluded: the MusicXML score drops too many sung morae to align reliably (dozens of gaps
# each). Not worth per-note repair; left out of training. (check with tools/check_align.py)
exclude: [stRay, Dreaming_with_U, matsuyukisou]
