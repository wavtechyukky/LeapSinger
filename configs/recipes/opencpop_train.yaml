# Recipe: Opencpop の学習用の区間（3550 本）。CC BY-NC-ND 4.0（非商用）。女性 1 人。
# ラベルは segments/transcriptions.txt の音素の長さなので、tools/convert_labels.py opencpop で lab に変換したものを読む
# （i を ir・i0 に分けるなら --split_i。辞書には i・ir・i0 の 3 つともある）:
#   python tools/convert_labels.py opencpop --src download/opencpop/transcriptions.txt --out download/opencpop_labels \
#       --split train=download/opencpop/train.txt test=download/opencpop/test.txt --split_i
# SP = 無音、AP = はっきり聞こえる息（どちらも pau へ。日本語の息と同じく、学習の目標では消す）。
name: opencpop_train
phonemes: dict/zh_opencpop.phonemes
spk_id: 0                 # train.py の既定（config の data.spk_map が優先）
style_id: 0
lab_unit: "100ns"
save_wav: false

layout: from_lab
db_root: "download/opencpop"        # Opencpop の segments/ フォルダ。絶対パスでもよい
wav: "wavs/{song}.wav"
lab: "download/opencpop_labels/train/{song}.lab"

phon_norm:
  "SP": pau
  "AP": pau
exclude: []
