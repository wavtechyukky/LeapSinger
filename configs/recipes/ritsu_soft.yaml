# Recipe: 波音リツ (Namine Ritsu) singing DB — **Soft** tone.
# Same singer/format as `ritsu` (the Ver2.0-2.2 無印/kire tone), a separate human
# recording set. Per-song folders each holding {song}.{lab,musicxml,wav}; lab is HTS 100ns.
name: ritsu_soft
spk_id: 1                   # same singer as `ritsu`; the Soft tone is a *style*, not a new speaker.
style_id: 2                # tone id (kire=0 / normal=1 / soft=2) — kept in the shard for style-aware training.
lab_unit: "100ns"
save_wav: false            # set true to enable pitch augmentation (stores clip wav)

layout: per_song
db_root: download/ritsu_soft/DATABASE
wav: "{song}/{song}.wav"
lab: "{song}/{song}.lab"

# ritsu labels glottal stops; fold them into the geminate-closure symbol.
phon_norm:
  GlottalStop: cl

# songs to skip (bad score/F0). Fill in as needed during alignment QA (tools/check_align.py).
exclude: []
