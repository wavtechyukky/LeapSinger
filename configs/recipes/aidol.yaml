# Recipe: Project AI❤dol Public English Dataset（Lotte V、女性 1 人、57 曲、1.76 h）。CC BY-SA 4.0。
# モデルを公開するには事前の許可が要る。ラベルは HTK（100 ns）。EP = 吐息、GS = 声門閉鎖、vf = ボーカルフライ。
name: aidol
phonemes: dict/en_full.phonemes
spk_id: 12                 # train.py の既定（config の data.spk_map が優先）
style_id: 0
lab_unit: "100ns"
save_wav: false

layout: type_split
db_root: "download/aidol"        # 配布元のフォルダをそのまま置く。絶対パスでもよい
wav_dir: "wav"
wav: "wav/{song}.wav"
lab: "lab/{song}.lab"

phon_norm:
  "SP": pau
  "AP": pau
  "EP": pau
  "GS": q
  "vf": vf
exclude: []
