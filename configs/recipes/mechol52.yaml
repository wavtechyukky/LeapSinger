# Recipe: Mechol の歌（十代の男性 1 人、約 52 分）。表記は Team CODA。Mechol さんから追加で受け取ったデータ（160 本）。
# 010 は Sds-Korean-Singing-Dataset の Mechol-001（Natural.wav）とまったく同じ録音・ラベル。2_* の 159 本は新しい録音
# （うち 11 本は Natural の最後の曲と同じ歌詞の別テイク）。なので、この 1 つで Mechol の全部になる（sds_mechol001 の代わり）。
# tools/convert_labels.py labdir --prefix mechol_ --split_sec 60 --skip 2_46 で整えたもの:
#   2 分を超える 010 だけ 1 分ほどの 29 片（RMVPE のメモリのため）。末尾の SP が音声を超える 21 本は音声の長さで切った。
#   2_46 はラベルが別のテイクのもの（音声の休みと 1 秒近く食い違う）なので除いた。
# 元のデータ: /Volumes/ssd2t/singing_database/kr/52min/{wav,lab}
# phon_norm の後半は、1 回ずつ出てくる書き間違いの写像。
name: mechol52
phonemes: dict/ko_coda.phonemes
spk_id: 0                 # train.py の既定（config の data.spk_map が優先）
style_id: 0
lab_unit: "100ns"
save_wav: false

layout: from_lab
db_root: "/Volumes/ssd2t/singing_database/_leapsinger_labels/mechol52"
wav: "{song}.wav"
lab: "{song}.lab"

phon_norm:
  "SP": pau
  "AP": pau
  "exh": pau
  "trash": pau
  "vf": vf
  "Sp": pau
  "sh": s
  "hh": h
  "R": r
  "O": o
  "D": d
  "ng": NG
  "uu": u
exclude: []
